<nav>
  <div class="logo">MAKA<span>ND</span></div>

  <!-- Pestañas. Las de paginasMenuMas pasan al menú "Más" cuando no
       caben en la fila (ver ajustarPestanas en navbar.ts); en celular
       se ven todas. -->
  <div class="tabs" #contenedorPestanas>
    <button class="tab" routerLink="/dashboard" routerLinkActive="on">Dashboard</button>
    <button class="tab" routerLink="/rutograma" routerLinkActive="on">Rutograma</button>
    <button class="tab" routerLink="/vehiculos" routerLinkActive="on">Vehículos</button>
    <button class="tab" routerLink="/rutas" routerLinkActive="on">Rutas</button>
    <button *ngFor="let p of paginasMenuMas" class="tab" [class.oculta]="rutasEnMenuMas.has(p.ruta)"
            [routerLink]="p.ruta" routerLinkActive="on">{{ p.nombre }}<span class="tab-pend" *ngIf="p.ruta === '/aprobaciones' && pendientesAprobacion">{{ pendientesAprobacion }}</span></button>
  </div>

  <div class="tab-mas" *ngIf="rutasEnMenuMas.size > 0">
    <button class="tab" [class.on]="masActivo()" (click)="alternarMenuMas()"
            [attr.aria-expanded]="menuMasAbierto">
      Más <i class="bi" [ngClass]="menuMasAbierto ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
    </button>
    <div class="menu-mas" *ngIf="menuMasAbierto">
      <ng-container *ngFor="let p of paginasMenuMas">
        <button *ngIf="rutasEnMenuMas.has(p.ruta)" class="menu-mas-item"
                [routerLink]="p.ruta" routerLinkActive="on" (click)="menuMasAbierto = false">{{ p.nombre }}<span class="tab-pend" *ngIf="p.ruta === '/aprobaciones' && pendientesAprobacion">{{ pendientesAprobacion }}</span></button>
      </ng-container>
    </div>
  </div>

  <div class="nav-search">
    <input #inputBusquedaGlobal
           type="text"
           placeholder="Buscar placa, conductor o ruta... (Ctrl+K)"
           [(ngModel)]="busquedaGlobal"
           (ngModelChange)="buscarGlobal()"
           (blur)="cerrarResultadosBusqueda()"
           style="background: var(--color-fondo-input); border: 1px solid var(--color-borde); color: var(--color-texto-principal); padding: 6px 12px; border-radius: 6px; font-size: 12px;">

    <div *ngIf="mostrandoResultadosBusqueda && resultadosBusqueda.length"
         style="position: absolute; top: calc(100% + 4px); left: 0; width: 280px; background: var(--color-fondo-tarjeta); border: 1px solid var(--color-borde); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); z-index: 9999; overflow: hidden;">
      <div *ngFor="let r of resultadosBusqueda"
           (mousedown)="irAResultadoBusqueda(r)"
           [style.cursor]="r.actual ? 'default' : 'pointer'"
           [style.opacity]="r.actual ? 0.7 : 1"
           style="padding: 8px 12px; border-bottom: 1px solid var(--color-borde-suave);">
        <div style="font-size: 12px; font-weight: 600; color: var(--color-texto-principal);">{{ r.etiqueta }}</div>
        <div style="font-size: 11px;" [style.color]="r.actual ? 'var(--green)' : 'var(--color-texto-apagado)'">{{ r.actual ? ('✓ ' + r.subtitulo) : (r.tipo + ' — ' + r.subtitulo) }}</div>
      </div>
    </div>

    <div *ngIf="mostrandoResultadosBusqueda && busquedaGlobal.trim() && !resultadosBusqueda.length"
         style="position: absolute; top: calc(100% + 4px); left: 0; width: 280px; background: var(--color-fondo-tarjeta); border: 1px solid var(--color-borde); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--color-texto-apagado); z-index: 9999;">
      Sin resultados para "{{ busquedaGlobal }}"
    </div>
  </div>

  <div class="nav-r" #accionesNav>
    <span class="badge fecha-nav" id="bdg-mes" [class.oculta]="ocultarFecha">{{ fechaHoy }}</span>

    <!-- Deshacer/Rehacer — historial LOCAL de esta computadora (hasta 30
         cambios), separado por Modo Real/Prueba. Deshabilitados cuando
         no hay nada que deshacer/rehacer. El title muestra qué cambio
         se va a revertir/reaplicar, sin tener que adivinar. -->
    <button data-guia="nav-deshacer" class="btn sm" *ngIf="authService.puedeEditar && !authService.necesitaAprobacion"
            [disabled]="!dataService.descripcionProximoDeshacer"
            [title]="dataService.descripcionProximoDeshacer ? ('Deshacer: ' + dataService.descripcionProximoDeshacer) : 'No hay ningún cambio reciente para deshacer'"
            (click)="deshacerUltimoCambio()">
      <i class="bi bi-arrow-counterclockwise"></i><span class="btn-txt"> Deshacer</span>
    </button>
    <button class="btn sm" *ngIf="authService.puedeEditar && !authService.necesitaAprobacion"
            [disabled]="!dataService.descripcionProximoRehacer"
            [title]="dataService.descripcionProximoRehacer ? ('Rehacer: ' + dataService.descripcionProximoRehacer) : 'No hay ningún cambio para rehacer'"
            (click)="rehacerUltimoCambio()">
      <i class="bi bi-arrow-clockwise"></i><span class="btn-txt"> Rehacer</span>
    </button>

    <app-en-linea></app-en-linea>
    <button class="btn grn sm" title="Descargar Diario" (click)="descargarDiario()"><i class="bi bi-download"></i><span class="btn-txt2"> <span class="btn-txt">Descargar </span>Diario</span></button>
    <button class="btn pri sm" *ngIf="authService.puedeEditar" title="Viaje Extra" (click)="abrirModal('m-viaje')"><i class="bi bi-plus-lg"></i><span class="btn-txt2"> Viaje Extra</span></button>
    <button class="btn sm" *ngIf="authService.puedeEditar" title="Novedad" (click)="abrirModal('m-novedad')"><i class="bi bi-lightning-charge"></i><span class="btn-txt2"> Novedad</span></button>
  </div>
</nav>

<!-- ============================================================ -->
<!-- MODAL: VIAJE EXTRA                                            -->
<!-- ============================================================ -->
<div class="nb-modal-backdrop" *ngIf="isModalViajeOpen" (click)="cerrarModalViaje()">
  <div class="nb-modal" (click)="$event.stopPropagation()">
    <h3>+ Viaje Extra</h3>

    <div class="nb-form-grid">
      <div class="nb-field" data-guia="ve-vehiculo">
        <label>Vehículo</label>
        <select [(ngModel)]="nuevoViaje.placa">
          <option value="" disabled selected>Selecciona un vehículo</option>
          <option *ngFor="let v of vehiculosParaViajeExtra()" [value]="v.p">
            {{ v.p }} — {{ v.tr }}
          </option>
        </select>
      </div>

      <div class="nb-field" data-guia="ve-ruta">
        <label>Ruta</label>
        <select [(ngModel)]="nuevoViaje.ruta" (ngModelChange)="onRutaExtraChange()">
          <option value="" disabled selected>Selecciona una ruta</option>
          <option *ngFor="let r of dataService.S?.rutas" [value]="r.cod">
            {{ r.cod }} — {{ r.dest || r.destino }}
          </option>
        </select>
      </div>

      <div class="nb-field" data-guia="ve-fecha">
        <label>Fecha</label>
        <input type="date" [(ngModel)]="nuevoViaje.fecha" [min]="fechaMinimaViajeExtra">
      </div>

      <div class="nb-field" data-guia="ve-cliente">
        <label>Cliente</label>
        <input type="text" [(ngModel)]="nuevoViaje.cliente" placeholder="Cliente">
      </div>

      <div class="nb-field" data-guia="ve-cajas">
        <label>Cajas</label>
        <input type="number" [(ngModel)]="nuevoViaje.cajas" placeholder="660">
      </div>

      <div class="nb-field" data-guia="ve-hora">
        <label>Hora</label>
        <input type="time" [(ngModel)]="nuevoViaje.hora">
      </div>
    </div>

    <div class="nb-modal-footer">
      <button class="btn sm" data-guia="ve-cerrar" [disabled]="procesandoViajeExtra" (click)="cerrarModalViaje()">Cerrar</button>
      <button class="btn pri sm" data-guia="ve-guardar" [disabled]="procesandoViajeExtra" (click)="guardarViajeExtra()">{{ procesandoViajeExtra ? 'Guardando...' : 'Guardar viaje' }}</button>
    </div>
  </div>
</div>

<!-- ============================================================ -->
<!-- MODAL: NOVEDAD                                                -->
<!-- ============================================================ -->
<div class="nb-modal-backdrop" *ngIf="isModalNovedadOpen" (click)="cerrarModalNovedad()">
  <div class="nb-modal" (click)="$event.stopPropagation()">
    <h3>&#9889; Reportar novedad</h3>

    <div class="nb-form-grid nb-form-grid-1">
      <div class="nb-field" data-guia="nov-tipo">
        <label>Tipo</label>
        <select [(ngModel)]="nuevaNovedad.tipo">
          <option value="Incidente">Incidente</option>
          <option value="Retraso">Retraso</option>
          <option value="Avería">Avería</option>
          <option value="Aviso">Aviso general</option>
        </select>
      </div>

      <div class="nb-field" data-guia="nov-titulo">
        <label>Título</label>
        <input type="text" [(ngModel)]="nuevaNovedad.titulo" placeholder="Resumen corto">
      </div>

      <div class="nb-field" data-guia="nov-desc">
        <label>Descripción</label>
        <textarea [(ngModel)]="nuevaNovedad.desc" rows="4" placeholder="Detalles de la novedad"></textarea>
      </div>
    </div>

    <div class="nb-modal-footer">
      <button class="btn sm" data-guia="nov-cerrar" (click)="cerrarModalNovedad()">Cerrar</button>
      <button class="btn pri sm" data-guia="nov-guardar" (click)="guardarNovedad()">Guardar novedad</button>
    </div>
  </div>
</div>
<!-- Modal de confirmación propio — reemplaza el confirm() nativo del
     navegador (feo/genérico) por uno con el mismo estilo del resto de
     la app. Mismo patrón ya usado en Rutograma. -->
<div class="nb-modal-backdrop" *ngIf="confirmDialogAbierto" style="z-index: 10002;">
  <div class="nb-modal" style="max-width: 420px;" (click)="$event.stopPropagation()">
    <p style="font-size: 14px; color: #e2e8f0; line-height: 1.5; margin: 0 0 18px 0; white-space: pre-line;">{{ confirmDialogMensaje }}</p>
    <div class="nb-modal-footer">
      <button class="btn sm" (click)="confirmDialogElegir(false)">{{ confirmDialogBtnCancelar }}</button>
      <button class="btn pri sm" (click)="confirmDialogElegir(true)">{{ confirmDialogBtnAceptar }}</button>
    </div>
  </div>
</div>

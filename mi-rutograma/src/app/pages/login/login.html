<div class="login-page">
  <div class="login-bg-lines"></div>
  <div class="login-glow login-glow-blue"></div>
  <div class="login-glow login-glow-amber"></div>

  <div class="login-card">
    <div class="login-card-accent"></div>

    <div class="login-header">
      <div class="login-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17V7a1 1 0 0 1 1-1h9v11" />
          <path d="M13 10h4l3 3v4h-7" />
          <circle cx="7" cy="17.5" r="1.8" />
          <circle cx="17" cy="17.5" r="1.8" />
        </svg>
      </div>
      <div class="login-wordmark">MAKA<span>ND</span></div>
      <div class="login-tagline">Logística de transporte</div>
    </div>

    <div class="login-route">
      <span class="login-route-dot"></span>
      <span class="login-route-line"><span class="login-route-pulse"></span></span>
      <span class="login-route-dot"></span>
    </div>

    <div class="login-title">
      <h2>Iniciar sesión</h2>
      <p>Accede a tu cuenta para gestionar el Rutograma</p>
    </div>

    <div class="form-group">
      <div class="login-input-wrap">
        <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="m3 7 9 6 9-6" />
        </svg>
        <input type="email" [(ngModel)]="email" placeholder="Correo electrónico" (keyup.enter)="loginTradicional()">
      </div>

      <div class="login-input-wrap">
        <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="9" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>
        <input type="password" [(ngModel)]="pass" placeholder="Contraseña" (keyup.enter)="loginTradicional()">
      </div>

      <label class="login-remember">
        <input type="checkbox" [(ngModel)]="recordarme" name="recordarme">
        <span>Mantener sesión iniciada en este equipo</span>
      </label>

      <button (click)="loginTradicional()" class="btn-primary">Entrar con tu cuenta</button>
    </div>

    <div class="login-footer">
      ¿No tienes una cuenta?
      <a routerLink="/register">¡Solicítala ya!</a>
    </div>
  </div>
</div>
